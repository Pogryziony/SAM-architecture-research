[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "nexus-graph"
version = "0.1.0"
description = "NEXUS — Non-Parametric Execution and Understanding System. Graph-first reasoning architecture."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7.0"]
train = ["torch>=2.3,<3"]
semantic = ["sentence-transformers>=3,<6"]
data = ["pyarrow>=18,<20"]
stack = []

[project.scripts]
nexus = "nexus.api:main"

[tool.setuptools.packages.find]
include = ["nexus*", "stack*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "torch: tests that require PyTorch (skipped when unavailable)",
]
