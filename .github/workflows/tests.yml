name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run full test suite
        run: python -m pytest tests/ -v --tb=short

      - name: Check optional embedding dependency
        run: |
          if python -c "import sentence_transformers" 2>/dev/null; then
            echo "Optional embedding dependency available"
          else
            echo "::warning::Optional embedding dependency unavailable; embedding-only checks are not run."
          fi

      - name: Run import smoke tests
        run: |
          python -c "from nexus.graph.store import InMemoryGraphStore; print('nexus OK')"
          python -c "from nexus.query.parser import parse_question; print('parser OK')"
          python -c "from nexus.utils.config import NEXUSConfig; print('config OK')"
          python -c "from nexus.utils.canonical_labels import canonicalize_intent; print('labels OK')"

      - name: Verify tests do not modify historical results.json
        run: git diff --exit-code -- benchmarks/results.json

  test-entity-ranker-v3:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies with CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"

      - name: Verify PyTorch installed
        run: python -c "import torch; print(f'PyTorch {torch.__version__} installed'); assert torch.__version__"

      - name: Run Entity Ranker V3 neural tests (must not skip)
        run: python -m pytest tests/test_entity_ranker_v3.py tests/test_canonical_mapping.py tests/test_entity_ranker_v3_infra.py -v --tb=short

      - name: Verify neural tests executed (not skipped)
        run: |
          OUTPUT=$(python -m pytest tests/test_entity_ranker_v3.py --collect-only -q 2>&1)
          if echo "$OUTPUT" | grep -q "skipped"; then
            echo "::error::Neural Entity Ranker V3 tests were SKIPPED. PyTorch must be available."
            exit 1
          fi
          echo "Neural tests collected successfully."

      - name: Verify historical benchmark artifacts not modified
        run: |
          git diff --exit-code -- benchmarks/results/entity_ranker_v3_selection_log.json
          git diff --exit-code -- benchmarks/results.json
          git diff --exit-code -- models/

      - name: Run optional torch collection tests
        run: python -m pytest tests/test_optional_torch_collection.py tests/test_realizer_torch.py -v --tb=short
